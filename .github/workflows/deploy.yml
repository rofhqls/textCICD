name: Github Actions 실행해보기    # Workflow의 이름

# 실행되는 시점 설정 : main branch 에서 push가 실행될 때
on:
  push:
    branchs:
      - main
    
# 실행 명령 설정
jobs:
  My-Deploy-Job:  # Job을 식별하기 위한 id
    runs-on: ubuntu-latest      # Github Actions을 시행시킬 서버 종류 선택
    
    steps:
      - name: Hello World 출력    # Step에 이름을 붙이는 기능
        run: echo "Hello World"   # 실행시킬 명령어 작성 